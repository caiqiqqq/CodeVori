# Add inside the existing HTTPS server. Keep the existing release mirror locations.
location ^~ /device-node/ {
    proxy_pass http://127.0.0.1:18081/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 650s;
    proxy_send_timeout 650s;
    proxy_buffering off;
    proxy_cache off;
    proxy_next_upstream off;
    client_max_body_size 128k;
    # Invitation tokens occur in download paths; do not log these request URLs.
    access_log off;
    error_log /dev/null crit;
}

# Install on the existing file server; this location is independent of the pairing service.
location ^~ /codevori-node/clients/ {
    alias /srv/codevori-node/clients/;
    autoindex off;
    default_type application/octet-stream;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache" always;
}
