name: Repository checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint and release validation
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      HUSKY: "0"
      ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build workflow type declarations for a clean checkout
        run: pnpm --filter @zcode/dynamic-workflow-runtime... build
      - run: node --test scripts/github-release.test.mjs
      - name: Execution client release and server mirror regressions
        run: |
          node --test scripts/package-device-node.test.mjs scripts/github-device-node-release.test.mjs
          python3 -m unittest discover -s scripts -p 'test_sync*.py'
      - name: Device bridge packaging and lifecycle regressions
        run: |
          pnpm exec tsx --test packages/desktop/test/deviceBridge*.test.*
          pnpm exec tsx --tsconfig packages/ui/tsconfig.json --test packages/ui/test/deviceBridgeSettingsNavigation.test.ts
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm architecture:check --changed
