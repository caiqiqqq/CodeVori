name: Build mobile apps

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, or leave empty for Actions artifacts only
        type: string
        required: false
  pull_request:
    branches: [main]
    paths:
      - apps/mobile/**
      - packages/shared/src/product-brand.mjs
      - scripts/github*-release*.mjs
      - .github/workflows/mobile.yml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CI: "1"
  HUSKY: "0"
  EXPO_NO_TELEMETRY: "1"
  EXPO_NO_DOTENV: "1"
  EXPO_PUBLIC_WEBVIEW_DEBUG: "0"
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
  ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.0
      - name: Validate mobile build source
        id: source
        run: node scripts/github-mobile-release.mjs validate
      - run: node --test scripts/github-release.test.mjs

  build:
    needs: prepare
    name: Build ${{ matrix.target }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, target: android-arm64-test, platform: android }
          - { runner: macos-26, target: ios-simulator-arm64, platform: ios }
    runs-on: ${{ matrix.runner }}
    env:
      MOBILE_TARGET: ${{ matrix.target }}
      MOBILE_PLATFORM: ${{ matrix.platform }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.0
          cache: pnpm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: "17"
      - run: pnpm install --frozen-lockfile --prod=false
      - name: Check mobile source and version
        run: |
          pnpm --filter @zcode/mobile typecheck
          pnpm --filter @zcode/mobile test
          mkdir -p apps/mobile/build
          pnpm --filter @zcode/mobile exec expo config --type public --json > apps/mobile/build/expo-config.json
          node scripts/github-mobile-release.mjs config
      - name: Generate native project from the pinned Expo template
        run: pnpm --filter @zcode/mobile exec expo prebuild --platform "$MOBILE_PLATFORM" --no-install --skip-dependency-update react,react-native
      - name: Build Android release-mode APK with Expo test signing
        if: matrix.platform == 'android'
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a
      - name: Verify Android signature, version and embedded JS
        if: matrix.platform == 'android'
        run: |
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          apk=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          "$tools/apksigner" verify --verbose "$apk"
          "$tools/aapt" dump badging "$apk" > apps/mobile/build/apk-info.txt
          grep -F "package: name='ai.zcode.lanmobile'" apps/mobile/build/apk-info.txt
          grep -F "versionName='$RELEASE_VERSION'" apps/mobile/build/apk-info.txt
          unzip -l "$apk" | grep -F 'assets/index.android.bundle'
      - name: Install iOS native dependencies
        if: matrix.platform == 'ios'
        working-directory: apps/mobile/ios
        run: pod install
      - name: Build iOS Release app for Apple Silicon simulators only
        if: matrix.platform == 'ios'
        working-directory: apps/mobile
        run: |
          xcodebuild -workspace ios/CodeVori.xcworkspace -scheme CodeVori -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=NO build
      - name: Verify and archive iOS simulator app
        if: matrix.platform == 'ios'
        working-directory: apps/mobile
        run: |
          app=build/ios/Build/Products/Release-iphonesimulator/CodeVori.app
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Info.plist")" = "$RELEASE_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")" = ai.zcode.lanmobile
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleSupportedPlatforms:0' "$app/Info.plist")" = iPhoneSimulator
          test -s "$app/main.jsbundle"
          ditto -c -k --sequesterRsrc --keepParent "$app" build/CodeVori.app.zip
      - name: Collect allowlisted mobile artifact and source manifest
        run: node scripts/github-mobile-release.mjs collect
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-${{ matrix.target }}
          path: dist-release/mobile/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Explain installation limits
        run: |
          echo 'Android: arm64 APK uses the public Expo test key; not suitable for store distribution.' >> "$GITHUB_STEP_SUMMARY"
          echo 'iOS: arm64 simulator .app.zip only; not an IPA and cannot be installed on iPhone. Device distribution requires Apple signing credentials.' >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: [prepare, build]
    if: github.event_name != 'pull_request' && (github.event.release.tag_name != '' || inputs.tag != '')
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mobile-*
          path: dist-release/mobile
          merge-multiple: true
      - name: Verify both mobile artifacts and publish without changing desktop assets
        run: node scripts/github-mobile-release.mjs publish
