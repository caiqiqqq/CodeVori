name: Release desktop and execution clients

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build (for example v0.0.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.0
      - name: Validate release version and source
        id: release
        run: node scripts/github-release.mjs validate
      - name: Test release validation
        run: node --test scripts/github-release.test.mjs

  build:
    needs: prepare
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, os: mac, arch: arm64 }
          - { runner: macos-15-intel, os: mac, arch: x64 }
          - { runner: windows-2025, os: win, arch: x64 }
          - { runner: ubuntu-22.04, os: linux, arch: x64 }
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      ZCODE_TARGET_OS: ${{ matrix.os }}
      ZCODE_TARGET_ARCH: ${{ matrix.arch }}
      ZCODE_ENV: production
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=6144
      ZCODE_SKIP_REMOTE_ASSETS: "1"
      ZCODE_ENABLE_MAC_SIGN: "0"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
      HUSKY: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.0
          cache: pnpm
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools zstd
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/device-bridge/go.mod
          cache-dependency-path: apps/device-bridge/go.sum
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prod=false
      - name: Prepare runtime and compile desktop app
        run: pnpm --filter @zcode/desktop build
      - name: Package and verify installers
        run: pnpm bundle:desktop -- --os "$ZCODE_TARGET_OS" --arch "$ZCODE_TARGET_ARCH" --skip-prepare --skip-build
      - name: Collect installers and source manifest
        run: node scripts/github-release.mjs collect
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.os }}-${{ matrix.arch }}
          path: dist-release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  build-device-node:
    needs: prepare
    name: Build six execution clients
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.0
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/device-bridge/go.mod
          cache-dependency-path: apps/device-bridge/go.sum
      - name: Test execution client and release packaging
        run: |
          (cd apps/device-bridge && go test -race ./...)
          node --test scripts/package-device-node.test.mjs scripts/github-device-node-release.test.mjs
          python3 -m unittest discover -s scripts -p 'test_sync*.py'
      - name: Build independent clients and collect release assets
        run: |
          node scripts/package-device-node.mjs --clients-only
          node scripts/github-device-node-release.mjs collect
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: device-node-clients
          path: dist-device-node/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: [prepare, build, build-device-node]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installers-*
          path: dist-release
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: device-node-clients
          path: dist-device-node
      - name: Verify both distributions before publishing
        run: |
          node scripts/github-release.mjs verify
          node scripts/github-device-node-release.mjs verify
      - name: Upload desktop installers to GitHub Release
        run: node scripts/github-release.mjs publish
      - name: Upload immutable clients and completion manifest to GitHub Release
        run: node scripts/github-device-node-release.mjs publish
