<script>
(() => {
  const root = document.getElementById('zcode-issue-walkthrough');
  const main = root.querySelector('.z-main');
  const stepNames = ['找到议题','指定智能体','开始任务','验收结果','同步议题','查看记录'];
  const catalog = {
    'Codex · ACP': {models:['CodexModel','CodexModel Lite'],modes:['代码执行','规划'],permissions:['请求时确认','完全访问'],reasoning:['低','中','高'],defaultModel:'CodexModel',defaultMode:'代码执行'},
    'Claude Code · ACP': {models:['Sonnet','Opus'],modes:['默认','规划'],permissions:['默认权限','接受编辑'],reasoning:[],defaultModel:'Sonnet',defaultMode:'默认'},
    'ZCode · API': {models:['项目模型 A','项目模型 B'],modes:['构建','编辑','规划','YOLO'],permissions:[],reasoning:['低','中','高'],defaultModel:'项目模型 A',defaultMode:'构建'}
  };
  const initial = { step:1, started:false, agent:'Codex · ACP', model:'default', mode:'default', reasoning:'default', permission:'default', provider:'项目提供商', branch:'main', title:'修复：画布关联蓝线存在异常', choice:'comment', appliedChoice:'comment', synced:false, skipped:false,
    prompt:'请调查并修复议题 #7：画布关联蓝线存在异常。\n\n检查连线关联与画布更新行为，补充回归验证。完成后给出原因、修改范围和实际验证结果，等待验收。',
    summary:'处理结论（示例）\n原因：连线关联更新后，画布引用未同步刷新。\n修改：统一关联更新入口，并同步刷新连线。\n验证：示例验收项为切换关联、删除重连、保存后重新打开；实际执行结果由任务填写。\n交付：本地修改待审阅；提交 / MR 链接按实际情况补充。' };
  let state = { ...initial };
  const drafts = {};
  let revision = -1;
  const esc = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const icon = name => `<i data-lucide="${name}" aria-hidden="true"></i>`;
  const source = () => `<div class="z-source">${icon('link')}<span class="z-muted">关联议题</span><strong>person/topology · #7</strong><span class="z-muted">画布关联蓝线存在异常</span></div>`;
  const button = (label,action,primary=false,iconName='') => `<button type="button" class="z-button ${primary?'z-primary':''} cursor-interaction" data-action="${action}">${iconName?icon(iconName):''}${label}</button>`;
  const heading = (label,title,subtitle) => `<div class="z-section-label">${label}</div><h2>${title}</h2><p class="z-subtitle">${subtitle}</p>`;
  const config = () => {
    const base=catalog[state.agent] || catalog[initial.agent];
    return state.agent==='ZCode · API'&&state.provider==='备用提供商'
      ? {...base,models:['备用模型 A','备用模型 B'],defaultModel:'备用模型 A'} : base;
  };
  const selected = (field) => state[field]==='default' ? (field==='model'?config().defaultModel:field==='mode'?config().defaultMode:field==='reasoning'?'中':config().permissions[0]) : state[field];
  const executionLabel = () => `${state.agent} · ${selected('model')} · ${selected('mode')}`;
  const selectField = (label,field,values,defaultLabel=null,hint='') => `<label class="z-field"><span>${label}</span><select data-field="${field}" aria-label="${label}">${defaultLabel?`<option value="default" ${state[field]==='default'?'selected':''}>${defaultLabel}</option>`:''}${values.map(value=>`<option value="${esc(value)}" ${state[field]===value?'selected':''}>${esc(value)}</option>`).join('')}</select>${hint?`<p class="z-hint">${hint}</p>`:''}</label>`;
  function normalize() {
    if (!catalog[state.agent]) state.agent=initial.agent;
    for (const [field,values] of [['model',config().models],['mode',config().modes],['reasoning',config().reasoning],['permission',config().permissions]]) {
      if (state[field]!=='default'&&!values.includes(state[field])) state[field]='default';
    }
  }
  function restore(snapshot) {
    const saved = snapshot?.privateContent;
    if (!saved || saved.version!==2) return false;
    const incomingRevision = Number.isSafeInteger(saved.revision) ? saved.revision : 0;
    if (incomingRevision<=revision) return false;
    revision=incomingRevision;
    for (const key of Object.keys(initial)) {
      if (typeof saved[key]===typeof initial[key]) state[key] = saved[key];
    }
    state.step = Math.max(0,Math.min(5,Math.floor(state.step)));
    if (!['comment','close'].includes(state.choice)) state.choice='comment';
    normalize();
    return true;
  }
  function persist() {
    revision++;
    if (window.openai?.setWidgetState) window.openai.setWidgetState({ modelContent:{preview:'ZCode 模式与模型配置方案',step:stepNames[state.step],executor:state.agent,model:selected('model'),mode:selected('mode'),feedback:state.choice==='close'?'记录后关闭议题':'仅记录结果'}, privateContent:{version:2,revision,...state} }).catch(()=>{});
  }
  function render() {
    root.querySelector('.z-steps').innerHTML = stepNames.map((name,index)=>`<button type="button" class="z-step cursor-interaction" data-step="${index}" ${state.step===index?'aria-current="step"':''}><span class="z-step-num">${index+1}</span><span>${name}</span></button>`).join('');
    root.querySelector('[data-side="repo"]').classList.toggle('z-selected',state.step===0||state.step===5);
    root.querySelector('[data-side="task"]').classList.toggle('z-selected',state.step>0&&state.step<5);
    root.querySelector('[data-progress]').textContent = `第 ${state.step+1} 步 / 共 6 步`;
    root.querySelector('[data-action="previous"]').disabled = state.step===0;
    root.querySelector('[data-action="next"]').disabled = state.step===5;
    if (state.step===0) {
      main.innerHTML = heading('01 / 代码仓库','找到议题，点击「处理」','从议题创建工作任务，保留来源关联。')+
      `<div class="z-spread"><h3 class="z-flex">${icon('git-fork')}person/topology</h3><span class="z-badge">GitLab</span></div>
       <div class="z-tabs"><span class="z-tab z-active">议题 <span class="z-muted">1</span></span><span class="z-tab">合并请求</span></div>
       <div class="z-issue-row">${icon('circle-dot')}<div class="z-issue-info"><h3>画布关联蓝线存在异常</h3><div class="z-meta"><span>#7</span><span>打开</span><span>刚刚更新</span></div></div>${button('处理','create',true,'sparkles')}</div>
       <div class="z-status-note">${icon('mouse-pointer-2')}<div>先选择执行智能体<p>点击「处理」后进入任务创建窗口，保存前可调整智能体与任务要求。</p></div></div>`;
    } else if (state.step===1) {
      main.innerHTML = heading('02 / 创建工作任务','指定智能体、模式与模型','先选择执行智能体，再配置此任务的模式和模型。')+
       `<section class="z-panel" aria-label="新建任务"><div class="z-panel-head">${icon('list-plus')}<h3>新建任务</h3></div><div class="z-panel-body">${source()}
       <label class="z-field"><span>任务名称</span><input type="text" data-field="title" value="${esc(state.title)}"></label>
       <section class="z-execution" aria-label="执行配置"><div class="z-execution-heading">${icon('sliders-horizontal')}执行配置<span class="z-badge">仅此任务</span></div>
       ${selectField('执行智能体','agent',Object.keys(catalog),null,'当前主智能体与对话不变。以下配置均为交互示例。')}
       <div class="z-fields-row">${selectField('模式','mode',config().modes,`跟随${state.agent.endsWith('ACP')?'智能体':'项目'}默认（${config().defaultMode}）`)}${selectField('模型','model',config().models,`跟随${state.agent.endsWith('ACP')?'智能体':'项目'}默认（${config().defaultModel}）`)}</div>
       <div class="z-config-note">${selected('mode')==='规划'?'规划模式：先产出方案，实施前等待确认。':'模式控制任务的执行方式；模型负责生成与推理。'}</div>
       ${state.agent==='ZCode · API'?selectField('模型提供商','provider',['项目提供商','备用提供商'],null,'模型列表随提供商更新；此处为示例。'):''}
       ${(config().reasoning.length||config().permissions.length)?`<div class="z-fields-row">${config().reasoning.length?selectField('思考强度','reasoning',config().reasoning,'跟随默认（中）'):''}${config().permissions.length?selectField('权限','permission',config().permissions,`跟随智能体默认（${config().permissions[0]}）`):''}</div>`:''}
       <div class="z-config-summary" aria-live="polite">${icon('check')}<span>${esc(executionLabel())}</span><span class="z-muted">· 示例选项</span></div>
       </section>
       <label class="z-field"><span>基准分支</span><select data-field="branch">${['main','当前工作分支'].map(b=>`<option ${state.branch===b?'selected':''}>${b}</option>`).join('')}</select><p class="z-hint">运行位置：独立工作树</p></label>
       <label class="z-field"><span>任务要求</span><textarea data-field="prompt" aria-label="任务要求">${esc(state.prompt)}</textarea></label>
       <div class="z-actions">${button('取消','cancel')}${button('加入待办','save',true,'plus')}</div></div></section>`;
    } else if (state.step===2) {
      main.innerHTML = heading('03 / 工作任务',state.started?'任务正在执行':'任务已创建，点击「开始」',state.started?'执行结束后进入待审阅，等待你验收。':'保存不会立即运行，确认配置后再开始。')+
       `<section class="z-panel"><div class="z-panel-head"><span class="z-muted">TASK-024 · 示例任务</span><span class="z-badge ${state.started?'z-running':''}">${state.started?'运行中':'待办'}</span></div><div class="z-panel-body"><div class="z-task-title">${esc(state.title)}</div>${source()}
       <div class="z-detail-row"><span class="z-detail-label">执行智能体</span><span>${esc(state.agent)}</span></div><div class="z-detail-row"><span class="z-detail-label">模式 / 模型</span><span>${esc(selected('mode'))} · ${esc(selected('model'))}</span></div><div class="z-detail-row"><span class="z-detail-label">工作环境</span><span>独立工作树 · ${esc(state.branch)}</span></div><div class="z-detail-row"><span class="z-detail-label">议题状态</span><span>打开</span></div>
       <div class="z-status-note">${icon(state.started?'loader-circle':'circle-play')}<div>${state.started?'正在调查关联更新与连线刷新逻辑…':'准备好后开始执行'}<p>${state.started?'完成只生成结果，不自动合并、推送或关闭议题。':'所选智能体在此任务内执行，原对话保留。'}</p></div></div>
       <div class="z-actions">${!state.started?button('调整执行配置','edit-config'):''}${state.started?button('模拟执行完成','review',true,'check'):button('开始','start',true,'play')}</div></div></section>`;
    } else if (state.step===3) {
      main.innerHTML = heading('04 / 结果审阅','检查结果，再确认完成','以下为示例内容；实际展示智能体的执行结果和验证记录。')+
       `<section class="z-panel"><div class="z-panel-head"><h3>TASK-024</h3><span class="z-badge z-review">待审阅</span><span class="z-muted">示例结果</span></div><div class="z-panel-body">
       <div class="z-review-block"><h3>原因与修改</h3><p>示例：关联更新后画布引用未同步刷新。统一关联更新入口，补齐连线刷新。</p></div>
       <div class="z-review-block"><h3>改动范围</h3><div class="z-file">${icon('file-code-2')}连线关联逻辑</div><div class="z-file">${icon('file-check-2')}画布交互回归场景</div></div>
       <div class="z-review-block"><h3>验证记录</h3><p>展示实际执行的检查、结果及未验证项。预览中的切换关联、删除重连、保存重开仅为验收示例。</p></div>
       <div class="z-review-block"><h3>交付状态</h3><p>本地修改待审阅 · 尚未提交 / 推送 / 合并</p></div>
       <div class="z-actions">${button('继续修改','revise')}${button('确认完成…','complete',true,'check')}</div></div></section>`;
    } else if (state.step===4) {
      main.innerHTML = heading('05 / 完成与反馈','处理结果怎么回到议题？','编辑要写回的摘要，再决定是否同时关闭议题。')+
       `<section class="z-panel"><div class="z-panel-head">${icon('message-square-text')}<h3>完成任务并同步议题</h3></div><div class="z-panel-body">${source()}
       <label class="z-field"><span>处理摘要</span><textarea data-field="summary" style="min-height:170px">${esc(state.summary)}</textarea><p class="z-hint">附带任务编号；只写摘要，不复制完整对话。提交或 MR 链接按实际情况补充。</p></label>
       <label class="z-choice cursor-interaction"><input type="radio" name="z-feedback" value="comment" ${state.choice==='comment'?'checked':''}><span>仅记录处理结果<small>向议题添加评论，议题保持打开。</small></span></label>
       <label class="z-choice cursor-interaction"><input type="radio" name="z-feedback" value="close" ${state.choice==='close'?'checked':''}><span>记录结果并关闭议题<small>先添加评论，成功后再关闭议题。</small></span></label>
       <div class="z-actions">${button('暂不同步，仅完成任务','skip')}${button(state.choice==='close'?'完成、记录并关闭':'完成并记录结果','sync',true,'check')}</div></div></section>`;
    } else {
      const closed = state.synced&&state.appliedChoice==='close';
      const done = state.synced||state.skipped;
      main.innerHTML = heading('06 / 议题记录',closed?'议题已关闭，处理过程可追溯':state.synced?'结果已记录，议题保持打开':state.skipped?'任务已完成，议题暂未同步':'回到议题查看处理记录','任务结果写入评论，关闭操作单独显示在议题时间线。')+
       `<div class="z-spread"><h3>#7 画布关联蓝线存在异常</h3><span class="z-badge ${closed?'':'z-open'}">${icon(closed?'circle-check':'circle-dot')}${closed?'已关闭':'打开'}</span></div>
       <div class="z-meta" style="margin-top:9px">person/topology<span>GitLab 议题</span></div>
       <div class="z-timeline"><div class="z-event"><span class="z-event-mark">${icon('circle-dot')}</span><div><div class="z-event-head">创建了议题<span class="z-muted">较早前</span></div><p class="z-muted" style="font-size:13px;margin:0">画布关联蓝线存在异常，请排查关联更新行为。</p></div></div>
       ${state.synced?`<div class="z-event"><span class="z-event-mark">${icon('message-square')}</span><div><div class="z-event-head">当前仓库账号添加了评论<span class="z-muted">刚刚 · 示例</span></div><div class="z-comment"><div class="z-comment-title">任务处理结果 · TASK-024</div>${esc(state.summary)}<div class="z-meta" style="margin-top:14px">关联任务：TASK-024 · 执行智能体：${esc(state.agent)}</div></div></div></div>`:''}
       ${closed?`<div class="z-event"><span class="z-event-mark">${icon('circle-check')}</span><div class="z-event-head">当前仓库账号关闭了议题<span class="z-muted">评论写入后</span></div></div>`:''}</div>
       ${done?`<div class="z-receipt"><span>${icon('check')} 任务：已完成</span><span>议题：${closed?'已关闭':'打开'}</span><span>结果：${state.synced?'已写入评论':'暂未同步'}</span></div>`:`<div class="z-status-note">${icon('message-square')}<div>还没有写回处理结果<p>回到上一步选择同步方式，即可看到评论和关闭记录。</p></div></div>`}
       <div class="z-actions">${button('返回同步设置','settings')}${button('从头体验','reset')}</div>`;
    }
    if (globalThis.lucide) lucide.createIcons({attrs:{width:16,height:16}});
  }
  root.addEventListener('click',event=>{
    const target = event.target.closest('button');
    if (!target||!root.contains(target)||target.disabled) return;
    if (target.hasAttribute('data-step')) state.step=Number(target.dataset.step);
    else switch(target.dataset.action) {
      case 'previous': state.step=Math.max(0,state.step-1); break;
      case 'next': state.step=Math.min(5,state.step+1); break;
      case 'create': case 'edit-config': state.step=1; break;
      case 'cancel': state.step=0; break;
      case 'save': state.step=2; state.started=false; state.synced=false; state.skipped=false; break;
      case 'start': state.started=true; break;
      case 'review': state.step=3; break;
      case 'revise': state.step=2; state.started=false; break;
      case 'complete': case 'settings': state.step=4; break;
      case 'sync': state.synced=true; state.appliedChoice=state.choice; state.skipped=false; state.step=5; break;
      case 'skip': state.skipped=true; state.synced=false; state.step=5; break;
      case 'reset': state={...initial,step:0}; break;
      default:return;
    }
    render(); persist();
  });
  root.addEventListener('input',event=>{
    const field=event.target.dataset.field;
    if (field&&Object.hasOwn(initial,field)&&event.target.tagName!=='SELECT') { state[field]=event.target.value; }
  });
  root.addEventListener('change',event=>{
    const field=event.target.dataset.field;
    if (field&&event.target.tagName==='SELECT') {
      if (field==='agent') {
        drafts[state.agent]={model:state.model,mode:state.mode,reasoning:state.reasoning,permission:state.permission,provider:state.provider};
        state.agent=event.target.value;
        Object.assign(state,drafts[state.agent]||{model:'default',mode:'default',reasoning:'default',permission:'default',provider:initial.provider});
      } else if (field==='provider') {
        state.provider=event.target.value; state.model='default';
      } else state[field]=event.target.value;
      normalize(); render();
      const replacement=root.querySelector(`[data-field="${field}"]`);
      replacement?.focus();
    }
    if (event.target.name==='z-feedback') { state.choice=event.target.value; render(); }
    persist();
  });
  restore(window.openai?.widgetState); render();
  window.addEventListener('openai:set_globals',event=>{
    if (restore(event.detail?.globals?.widgetState)) render();
  });
})();
</script>
