        symbol: createMcpSyncService
      - file: packages/services/src/skills/skillsService.ts
        symbol: createSkillsService
    invariants:
      - The target Host owns ACP mapping and transcript; the ACP Agent owns model context.
      - Composer submitPrompt waits for durable Host acceptance independently of live notifications; prompt retains whole-turn semantics for internal callers.
      - ZCode and API Provider sessions use the existing V4 command path.
      - Codex native credentials and model choices are owned by the target Host's Codex files and apply to new ACP connections.
      - ACP new and load use enabled MCP settings on the target Host; unsupported authentication and transports fail before session admission.
      - ACP explicitly named skills use the current settings owner; API and ZCode keep the native runtime catalog.
      - ACP tool details belong to the existing session snapshot; diagnostics contain only bounded correlated metadata and continue after log rotation.
      - Trace subscriptions use the target workspace identity and do not create, authenticate or reconnect an Agent.
      - Reported ACP thoughts and full plans belong to Host snapshots; transcript replay does not duplicate them.
      - ACP session-scoped form elicitation shares the Host blocking queue with tool permissions; answers are validated before adapter receipt and are not persisted.
