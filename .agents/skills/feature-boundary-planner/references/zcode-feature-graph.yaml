    codeSeeds:
      - file: packages/services/src/delegation/delegationMcp.ts
        symbol: createDelegationMcp
      - file: apps/zcode-cli/packages/bootstrap/src/zcode-protocol/delegation-lifecycle.ts
        symbol: pauseHostDelegations
    invariants:
      - Tokens are ephemeral; child result submission checks the current command and lease.
      - Stop must validate foreground identity before pausing delegation.
